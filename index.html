<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Online - Katalog Produk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🛒 Toko Serba Ada</a>
            <a href="admin.html" class="btn btn-outline-warning btn-sm fw-semibold">Login Admin ⚙️</a>
        </div>
    </nav>

    <!-- Katalog Produk -->
    <div class="container pb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0">Katalog Produk Tersedia</h4>
            <span class="badge bg-primary fs-6">Mode Pengunjung</span>
        </div>

        <div id="katalogList" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
            <div class="col-12 text-center text-muted py-5">Memuat produk...</div>
        </div>
    </div>

    <!-- Firebase SDK (v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIEJHWd7EBzC0FeWgtlmNF0CHpPcyCrK4",
            authDomain: "forminput-9c324.firebaseapp.com",
            projectId: "forminput-9c324",
            storageBucket: "forminput-9c324.firebasestorage.app",
            messagingSenderId: "105974451173",
            appId: "1:105974451173:web:d2976fc5ed60dad0d23d0c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
        }

        // TAMPILKAN KATALOG PRODUK REALTIME
        onSnapshot(collection(db, "products"), (snapshot) => {
            const katalogList = document.getElementById("katalogList");
            katalogList.innerHTML = "";

            if (snapshot.empty) {
                katalogList.innerHTML = `<div class="col-12 text-center text-muted py-5">Belum ada produk jualan.</div>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();

                katalogList.innerHTML += `
                    <div class="col">
                        <div class="card h-100 shadow-sm border-0">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title fw-bold fs-6 mb-2">${data.nama_barang}</h5>
                                <p class="card-text text-primary fw-bold mb-3 fs-5">${formatRupiah(data.harga)}</p>
                                <div class="mt-auto d-flex justify-content-between align-items-center pt-2 border-top">
                                    <small class="text-muted">Stok: ${data.stok}</small>
                                    <span class="badge ${data.stok > 0 ? 'bg-success' : 'bg-danger'}">
                                        ${data.stok > 0 ? 'Tersedia' : 'Habis'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
        });
    </script>
</body>
</html>
