<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Kelola Barang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">⚙️ Admin Panel Toko</a>
            <a href="index.html" class="btn btn-outline-light btn-sm">Lihat Web Pengunjung ↗</a>
        </div>
    </nav>

    <div class="container pb-5">
        <div id="alertBox"></div>

        <div class="row">
            <!-- Form Input Barang -->
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white fw-bold" id="formTitle">
                        Tambah Barang Baru
                    </div>
                    <div class="card-body">
                        <form id="productForm">
                            <input type="hidden" id="productId">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nama Barang</label>
                                <input type="text" id="namaBarang" class="form-control" placeholder="Contoh: Kopi Bubuk 250g" required>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label fw-semibold">Harga (Rp)</label>
                                    <input type="number" id="hargaBarang" class="form-control" placeholder="15000" required>
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label fw-semibold">Stok</label>
                                    <input type="number" id="stokBarang" class="form-control" placeholder="50" required>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" id="btnSimpan" class="btn btn-success w-100">Simpan Barang</button>
                                <button type="button" id="btnBatal" class="btn btn-secondary d-none" onclick="resetForm()">Batal</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabel Daftar Barang -->
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-white fw-bold">Daftar Inventaris Barang</div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Nama Barang</th>
                                        <th>Harga</th>
                                        <th>Stok</th>
                                        <th class="text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="adminTableBody">
                                    <tr><td colspan="4" class="text-center text-muted">Memuat data...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIEJHWd7EBzC0FeWgtlmNF0CHpPcyCrK4",
            authDomain: "forminput-9c324.firebaseapp.com",
            projectId: "forminput-9c324",
            storageBucket: "forminput-9c324.firebasestorage.app",
            messagingSenderId: "105974451173",
            appId: "1:105974451173:web:d2976fc5ed60dad0d23d0c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const productsCollection = collection(db, "products");

        function showAlert(msg, type) {
            document.getElementById("alertBox").innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${msg}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>`;
        }

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
        }

        // SIMPAN / UPDATE BARANG
        document.getElementById("productForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = document.getElementById("productId").value;
            const nama = document.getElementById("namaBarang").value;
            const harga = Number(document.getElementById("hargaBarang").value);
            const stok = Number(document.getElementById("stokBarang").value);

            const btn = document.getElementById("btnSimpan");
            btn.disabled = true;
            btn.innerText = "Menyimpan...";

            try {
                if (id) {
                    await updateDoc(doc(db, "products", id), {
                        nama_barang: nama,
                        harga: harga,
                        stok: stok
                    });
                    showAlert("Data barang berhasil diupdate!", "success");
                } else {
                    await addDoc(productsCollection, {
                        nama_barang: nama,
                        harga: harga,
                        stok: stok,
                        created_at: new Date()
                    });
                    showAlert("Barang baru berhasil ditambah!", "success");
                }
                resetForm();
            } catch (err) {
                showAlert(`Gagal: ${err.message}`, "danger");
            } finally {
                btn.disabled = false;
                btn.innerText = "Simpan Barang";
            }
        });

        // REALTIME TABEL ADMIN
        onSnapshot(productsCollection, (snapshot) => {
            const tbody = document.getElementById("adminTableBody");
            tbody.innerHTML = "";

            if (snapshot.empty) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">Belum ada barang.</td></tr>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;

                tbody.innerHTML += `
                    <tr>
                        <td class="fw-semibold">${data.nama_barang}</td>
                        <td>${formatRupiah(data.harga)}</td>
                        <td><span class="badge ${data.stok > 0 ? 'bg-success' : 'bg-danger'}">${data.stok}</span></td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-warning me-1" onclick="editProduct('${id}', '${data.nama_barang}', ${data.harga}, ${data.stok})">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteProduct('${id}')">Hapus</button>
                        </td>
                    </tr>`;
            });
        });

        window.editProduct = (id, nama, harga, stok) => {
            document.getElementById("productId").value = id;
            document.getElementById("namaBarang").value = nama;
            document.getElementById("hargaBarang").value = harga;
            document.getElementById("stokBarang").value = stok;

            document.getElementById("formTitle").innerText = "Edit Barang";
            document.getElementById("btnSimpan").innerText = "Update Barang";
            document.getElementById("btnBatal").classList.remove("d-none");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.resetForm = () => {
            document.getElementById("productForm").reset();
            document.getElementById("productId").value = "";

            document.getElementById("formTitle").innerText = "Tambah Barang Baru";
            document.getElementById("btnSimpan").innerText = "Simpan Barang";
            document.getElementById("btnBatal").classList.add("d-none");
        };

        window.deleteProduct = async (id) => {
            if (confirm("Yakin mau hapus barang ini?")) {
                await deleteDoc(doc(db, "products", id));
                showAlert("Barang dihapus!", "success");
            }
        };
    </script>
</body>
</html>
